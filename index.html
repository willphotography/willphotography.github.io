<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Photography Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation -->
  <nav>
    <h2 class="logo">William Photography</h2>
    <ul class="nav-links">
      <li><a href="#astro">Astro</a></li>
      <li><a href="#nature">Nature</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <h1>My Photography</h1>
    <p>Astro • Nature </p>
  </section>

  <!-- Astro Gallery -->
  <section id="astro" class="gallery-section">
    <h2>Astro Photography</h2>
    <div class="gallery">
      <img src="images/astro1.jpg" alt="Astro Photo 1">
      <img src="images/astro2.jpg" alt="Astro Photo 2">
      <img src="images/astro3.jpg" alt="Astro Photo 3">
      <img src="images/astro4.jpg" alt="Astro Photo 4">
      <img src="images/astro5.jpg" alt="Astro Photo 5">
      <img src="images/astro6.jpg" alt="Astro Photo 6">
    </div>
  </section>

  <!-- Nature Gallery -->
  <section id="nature" class="gallery-section">
    <h2>Nature Photography</h2>
    <div class="gallery">
      <img src="images/natureimg.1.jpeg" alt="Nature Photo 1">
      <img src="images/nature2.jpg" alt="Nature Photo 2">
      <img src="images/nature3.jpg" alt="Nature Photo 3">
    </div>
    <div class="watermark-wrapper">
  <img src="images/natureimg.1.jpeg" alt="Nature Photo">
  <div class="watermark">© William Photography</div>
</div>
  </section>

  <script src="script.js"></script>
</body>
</html>
